name: HomePortMenu
options:
  bundleIdPrefix: fr.lauriat
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  HomePortManager:
    path: ..
targets:
  HomePortMenu:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: HomePortManager
        product: HomePortKit
    info:
      path: Info.plist
      properties:
        CFBundleName: HomePort Manager
        CFBundleDisplayName: HomePort Manager
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSHumanReadableCopyright: "© Vincent Lauriat — MIT"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lauriat.homeport-manager
        PRODUCT_NAME: HomePort Manager
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.9"
