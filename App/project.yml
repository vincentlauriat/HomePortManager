name: HomePortMenu
options:
  bundleIdPrefix: fr.lauriat
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  HomePortManager:
    path: ..
targets:
  HomePortMenu:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: HomePortManager
        product: HomePortKit
    info:
      path: Info.plist
      properties:
        CFBundleName: HomePort Manager
        CFBundleDisplayName: HomePort Manager
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: false
        NSHumanReadableCopyright: "© Vincent Lauriat — MIT"
        # AD-3: the single App Transport Security exception — plain HTTP on the tailnet,
        # whose hosts (MagicDNS names, 100.x addresses) cannot be enumerated per domain.
        # Shared by the dashboard WKWebView and the future Homeport API client (epic 2);
        # no story adds its own bypass, no other ATS key exists anywhere.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lauriat.homeport-manager
        PRODUCT_NAME: HomePort Manager
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.9"
